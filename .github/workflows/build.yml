name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: make app

      - uses: actions/upload-artifact@v4
        with:
          name: MeetRec.app
          path: dist/MeetRec.app
