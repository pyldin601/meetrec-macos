name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle (${{ matrix.arch }})
        run: make app ARCH=${{ matrix.arch }}

      - name: Zip app bundle
        run: |
          cd dist
          zip -ry MeetRec-${{ matrix.arch }}.app.zip MeetRec-${{ matrix.arch }}.app

      - uses: actions/upload-artifact@v4
        with:
          name: MeetRec-${{ matrix.arch }}
          path: dist/MeetRec-${{ matrix.arch }}.app.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build (${{ github.sha }})
          make_latest: true
          files: artifacts/**/*.zip
