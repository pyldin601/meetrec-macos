name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build app bundle
        run: make app
      - name: Zip app (preserves permissions)
        run: ditto -c -k --keepParent dist/MeetRec.app dist/MeetRec.app.zip
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeetRec.app
          path: dist/MeetRec.app.zip
